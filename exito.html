<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Compra Exitosas! - NutraNuts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-h-screen flex items-center justify-center text-stone-800 px-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-amber-100">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
            ✓
        </div>
        
        <h1 class="text-2xl font-bold text-amber-900 mb-2">¡Pago Aprobado con Éxito!</h1>
        <p class="text-sm text-stone-600 mb-6">Muchas gracias por tu compra en NutraNuts. Hemos registrado tu pedido y la tía ya fue notificada para coordinar tu despacho en La Serena / Coquimbo.</p>

        <div id="status-orden" class="text-xs text-stone-500 mb-6 bg-stone-50 p-3 rounded-lg border border-stone-200">
            Registrando orden en el sistema...
        </div>

        <a href="index.html" class="inline-block w-full py-3 bg-amber-800 hover:bg-amber-900 text-white font-semibold rounded-xl shadow transition">
            Volver a la Tienda 🥜
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusDiv = document.getElementById('status-orden');
            
            // Limpiamos el carrito local porque la compra ya se hizo.
            // La orden y el stock ya fueron procesados por nuestro servidor en el Webhook.
            localStorage.removeItem('cart_items');
            sessionStorage.removeItem('pending_order_cliente');
            sessionStorage.removeItem('pending_order_items');

            statusDiv.innerHTML = "✅ ¡Tu pedido ha sido confirmado en nuestro sistema!";
        });
    </script>

    <script src="scripts/config.js"></script>
</body>
</html>
