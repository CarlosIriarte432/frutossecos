<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | NutraNuts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdfbf7',
                            100: '#f7f2e8',
                            200: '#eee2cd',
                            500: '#d97706',
                            600: '#b45309',
                            800: '#5c2c16',
                            900: '#3a1a0c',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header Admin -->
    <header class="bg-brand-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="bg-amber-400 text-brand-900 px-3 py-1 rounded-lg font-black text-sm">ADMIN</span>
                <h1 class="text-xl font-bold">NutraNuts ~ Panel de Control</h1>
            </div>
            <a href="index.html" class="text-xs bg-brand-800 hover:bg-brand-700 px-3 py-2 rounded-lg transition-colors flex items-center gap-1.5">
                <i data-lucide="store" class="w-4 h-4"></i> Ver Tienda Pública
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-10">

        <!-- Tabs de navegación interna -->
        <div class="flex border-b border-gray-200 gap-6">
            <button onclick="cambiarTab('pedidos')" id="tab-pedidos-btn" class="pb-3 font-bold border-b-2 border-brand-800 text-brand-900 flex items-center gap-2">
                <i data-lucide="shopping-bag" class="w-5 h-5"></i> Pedidos Recibidos
            </button>
            <button onclick="cambiarTab('inventario')" id="tab-inventario-btn" class="pb-3 font-semibold text-gray-500 hover:text-brand-800 border-b-2 border-transparent flex items-center gap-2">
                <i data-lucide="package" class="w-5 h-5"></i> Gestión de Inventario & Stock
            </button>
        </div>

        <!-- SECCIÓN 1: PEDIDOS -->
        <section id="seccion-pedidos" class="space-y-4">
            <h2 class="text-xl font-bold text-brand-900">Historial de Órdenes de Clientes</h2>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-brand-50 text-brand-900 text-xs font-bold uppercase tracking-wider border-b border-gray-200">
                                <th class="p-4">ID / Fecha</th>
                                <th class="p-4">Cliente</th>
                                <th class="p-4">Contacto / Dirección</th>
                                <th class="p-4">Total</th>
                                <th class="p-4">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-pedidos-body" class="divide-y divide-gray-100 text-sm">
                            <!-- Se llena por JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- SECCIÓN 2: INVENTARIO -->
        <section id="seccion-inventario" class="space-y-6 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-brand-900">Control de Precios y Stock Numérico</h2>
                <button onclick="abrirModalNuevoProducto()" class="bg-brand-800 hover:bg-brand-900 text-white text-sm px-4 py-2.5 rounded-xl font-semibold shadow transition-all flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> Nuevo Producto
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-brand-50 text-brand-900 text-xs font-bold uppercase tracking-wider border-b border-gray-200">
                                <th class="p-4">Producto</th>
                                <th class="p-4">Categoría</th>
                                <th class="p-4">Precio (CLP)</th>
                                <th class="p-4">Stock (Unidades)</th>
                                <th class="p-4">Estado</th>
                                <th class="p-4 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-inventario-body" class="divide-y divide-gray-100 text-sm">
                            <!-- Se llena por JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Script de Administración -->
    <script>
        const API_URL = 'http://localhost:3000/api';

        function cambiarTab(tab) {
            const secPedidos = document.getElementById('seccion-pedidos');
            const secInventario = document.getElementById('seccion-inventario');
            const btnPedidos = document.getElementById('tab-pedidos-btn');
            const btnInventario = document.getElementById('tab-inventario-btn');

            if (tab === 'pedidos') {
                secPedidos.classList.remove('hidden');
                secInventario.classList.add('hidden');
                btnPedidos.className = "pb-3 font-bold border-b-2 border-brand-800 text-brand-900 flex items-center gap-2";
                btnInventario.className = "pb-3 font-semibold text-gray-500 hover:text-brand-800 border-b-2 border-transparent flex items-center gap-2";
                cargarPedidos();
            } else {
                secPedidos.classList.add('hidden');
                secInventario.classList.remove('hidden');
                btnInventario.className = "pb-3 font-bold border-b-2 border-brand-800 text-brand-900 flex items-center gap-2";
                btnPedidos.className = "pb-3 font-semibold text-gray-500 hover:text-brand-800 border-b-2 border-transparent flex items-center gap-2";
                cargarInventario();
            }
        }

        async function cargarPedidos() {
            try {
                const res = await fetch(`${API_URL}/admin/ordenes`);
                const ordenes = await res.json();
                const tbody = document.getElementById('tabla-pedidos-body');

                if (ordenes.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">No hay pedidos registrados aún.</td></tr>`;
                    return;
                }

                tbody.innerHTML = ordenes.map(o => `
                    <tr class="hover:bg-gray-50/50">
                        <td class="p-4 font-medium text-gray-900">#${o.id}<br><span class="text-xs text-gray-400">${o.fecha || 'Reciente'}</span></td>
                        <td class="p-4 font-semibold text-brand-900">${o.cliente_nombre || 'Invitado'}</td>
                        <td class="p-4 text-xs space-y-1">
                            <p>📞 ${o.cliente_telefono || 'Sin teléfono'}</p>
                            <p>✉️ ${o.cliente_email || 'Sin correo'}</p>
                            <p class="font-medium text-gray-700">📍 ${o.cliente_direccion || 'Sin dirección'}</p>
                        </td>
                        <td class="p-4 font-bold text-amber-800">$${Number(o.total).toLocaleString('es-CL')}</td>
                        <td class="p-4">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">${o.estado || 'Aprobado'}</span>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error cargando pedidos:', err);
            }
        }

        async function cargarInventario() {
            try {
                const res = await fetch(`${API_URL}/productos`);
                const productos = await res.json();
                const tbody = document.getElementById('tabla-inventario-body');

                tbody.innerHTML = productos.map(p => `
                    <tr class="hover:bg-gray-50/50">
                        <td class="p-4 flex items-center gap-3">
                            <img src="${p.imagen}" class="w-10 h-10 rounded-lg object-cover border" onerror="this.src='https://via.placeholder.com/40'">
                            <span class="font-semibold text-gray-900">${p.nombre}</span>
                        </td>
                        <td class="p-4 text-gray-600 capitalize">${p.categoria}</td>
                        <td class="p-4">
                            <input type="number" id="precio-${p.id}" value="${p.precio}" class="w-28 px-2 py-1 border rounded-lg text-sm">
                        </td>
                        <td class="p-4">
                            <input type="number" id="stock-${p.id}" value="${p.stock_unidades}" class="w-20 px-2 py-1 border rounded-lg text-sm font-bold">
                        </td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded-full text-xs font-bold ${p.disponible === 1 ? 'bg-amber-100 text-amber-900' : 'bg-rose-100 text-rose-800'}">
                                ${p.disponible === 1 ? 'Disponible' : 'Agotado'}
                            </span>
                        </td>
                        <td class="p-4 text-center">
                            <button onclick="guardarCambiosProducto(${p.id})" class="bg-brand-100 hover:bg-brand-800 hover:text-white text-brand-900 px-3 py-1.5 rounded-xl text-xs font-bold transition-all">
                                Guardar
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error cargando inventario:', err);
            }
        }

        async function guardarCambiosProducto(id) {
    const nuevoPrecio = document.getElementById(`precio-${id}`).value;
    const nuevoStock = document.getElementById(`stock-${id}`).value;

    try {
        const res = await fetch(`${API_URL}/admin/productos/${id}`, {
            method: 'PATCH', // <-- Cambiado de PUT a PATCH para que coincida con el backend
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ precio: Number(nuevoPrecio), stock_unidades: Number(nuevoStock) })
        });
        
        const data = await res.json();
        
        if (res.ok && data.success) {
            alert('✅ ¡Producto actualizado con éxito!');
            cargarInventario();
        } else {
            alert('❌ Error al actualizar: ' + (data.error || 'Desconocido'));
        }
    } catch (err) {
        console.error('Error de red:', err);
        alert('⚠️ Error de conexión con el servidor backend.');
    }
}

        async function abrirModalNuevoProducto() {
            const nombre = prompt('Nombre del nuevo producto:');
            if (!nombre) return;
            const precio = prompt('Precio en CLP (ej: 3500):');
            if (!precio) return;
            const categoria = prompt('Categoría (frutos-secos, semillas, mixes, deshidratados):');
            if (!categoria) return;
            const stock = prompt('Stock inicial en unidades (ej: 20):', '20');

            try {
                const res = await fetch(`${API_URL}/admin/productos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, precio, categoria, stock_unidades: stock })
                });
                const data = await res.json();
                if (data.success) {
                    alert('🎉 ¡Nuevo producto agregado!');
                    cargarInventario();
                }
            } catch (err) {
                console.error('Error:', err);
            }
        }

        // Cargar pedidos al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            cargarPedidos();
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
